[package]
name = "aven-dispatch"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Durable one-task Aven to OpenCode V2 dispatcher"

[[bin]]
name = "aven-dispatch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
