[package]
name = "aven-dispatch"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Durable one-task Aven to OpenCode V2 dispatcher"

[[bin]]
name = "aven-dispatch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
