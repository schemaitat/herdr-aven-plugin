# Extra aven TUI commands that scripts/install-aven-command.sh writes under
# tui.commands, after the built-in "dispatch" command. This file is part of the
# plugin; edit it, then re-run the installer to apply changes:
#
#   herdr plugin action invoke aven.tasks.install-aven-command
#
# Every active entry is indented under tui.commands and has ${PLUGIN_ROOT}
# replaced with this plugin's directory, so it can pass the bundled workflow
# directory to the globally installed Rust CLI. Write each entry at the file's left margin ("- name:")
# with its fields indented relative to it; comment and blank lines are dropped.
#
# Fields follow aven's custom-command schema
# (https://aventasks.dev/custom-commands/): name and program are required;
# aliases, description, cwd, env, timeout_seconds, args, keys, detail_keys,
# target, execution, and on_success are optional. Names must be unique across
# custom and built-in commands. Point AVEN_COMMANDS_FILE at another file to use
# a different set of extra commands.
#
# --- Example: an aven-native task workflow -----------------------------------
#
# The three bundled workflows divide planning from implementation:
# `sdd-plan-implement` plans first and then implements in one session;
# `sdd-plan` only plans; and `sdd-implement` only implements an already
# worked-out plan. All are examples: edit, rebind, or delete them to fit your
# own Aven workflow.
#
# --skill names the bundled skill text as a path relative to skills.
# `aven/sdd-plan` resolves to skills/aven/sdd-plan.md. Write your own namespaced
# skill file and point another entry at it the same way.

- name: sdd-plan-implement
  aliases: [aven-sdd-plan-implement]
  description: Plan then implement the selected task (example)
  program: aven-dispatch
  args:
    - dispatch
    - --agent
    - select
    - --preferred-agent
    - build
    - --preferred-model
    - github-copilot/gpt-5.6-terra
    - --skill
    - aven/sdd-plan-implement
    - --skills-dir
    - "${PLUGIN_ROOT}/skills"
  keys: [z s]
  detail_keys: [z s]
  target: focused
  execution: terminal
  on_success: quit

# Turn a selected task idea into a durable Aven-only implementation plan. The
# planning workflow detects its `sdd.plan-worked-out` metadata marker to avoid
# recreating an existing plan. Every plan root becomes an epic; implementation
# phases, including a single phase, become its ordered children.
- name: sdd-plan
  aliases: [aven-sdd-plan]
  description: Turn the selected task idea into an epic-rooted implementation plan
  program: aven-dispatch
  args:
    - dispatch
    - --agent
    - select
    - --preferred-agent
    - plan
    - --preferred-model
    - github-copilot/gpt-6.1-sol
    - --skill
    - aven/sdd-plan
    - --skills-dir
    - "${PLUGIN_ROOT}/skills"
  keys: [z p]
  detail_keys: [z P]
  target: focused
  execution: terminal
  on_success: quit

# Implement only after a plan has been completed with z p or z s. The workflow
# checks the root task's sdd.plan-worked-out metadata before changing code.
- name: sdd-implement
  aliases: [aven-sdd-implement]
  description: Implement the selected task's already-worked-out plan
  program: aven-dispatch
  args:
    - dispatch
    - --agent
    - select
    - --preferred-agent
    - build
    - --preferred-model
    - github-copilot/gpt-5.6-terra
    - --skill
    - aven/sdd-implement
    - --skills-dir
    - "${PLUGIN_ROOT}/skills"
  keys: [z i]
  detail_keys: [z I]
  target: focused
  execution: terminal
  on_success: quit

# Babysitting is intentionally available only for workflows that implement:
# the plan-and-implement SDD flow and implementation of an existing plan.
- name: sdd-plan-implement-babysitter
  aliases: [aven-sdd-plan-implement-babysitter]
  description: Plan then implement the selected task with an adjacent babysitter
  program: aven-dispatch
  args:
    - dispatch
    - --agent
    - select
    - --preferred-agent
    - build
    - --preferred-model
    - github-copilot/gpt-5.6-terra
    - --skill
    - aven/sdd-plan-implement
    - --skills-dir
    - "${PLUGIN_ROOT}/skills"
    - --babysitter
  keys: [z S]
  detail_keys: [z S]
  target: focused
  execution: terminal
  on_success: quit

- name: sdd-implement-babysitter
  aliases: [aven-sdd-implement-babysitter]
  description: Implement the selected task's plan with an adjacent babysitter
  program: aven-dispatch
  args:
    - dispatch
    - --agent
    - select
    - --preferred-agent
    - build
    - --preferred-model
    - github-copilot/gpt-5.6-terra
    - --skill
    - aven/sdd-implement
    - --skills-dir
    - "${PLUGIN_ROOT}/skills"
    - --babysitter
  keys: [z b]
  detail_keys: [z B]
  target: focused
  execution: terminal
  on_success: quit

# Discard only dispatcher/planning state for the focused task. This deliberately
# has no --yes flag: the terminal prompt is the final destructive-action guard.
- name: dispatch-reset
  aliases: [aven-dispatch-reset]
  description: Reset dispatch and plan state for the focused task
  program: aven-dispatch
  args: [reset]
  keys: [z r]
  detail_keys: [z R]
  target: focused
  execution: terminal
  on_success: quit

