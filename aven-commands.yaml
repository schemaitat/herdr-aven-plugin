# Extra aven TUI commands that scripts/install-aven-command.sh writes under
# tui.commands, after the built-in "dispatch" command. This file is part of the
# plugin; edit it, then re-run the installer to apply changes:
#
#   herdr plugin action invoke aven.tasks.install-aven-command
#
# Every active entry is indented under tui.commands and has ${PLUGIN_ROOT}
# replaced with this plugin's directory, so it can pass the bundled workflow
# directory to the globally installed Rust CLI. Write each entry at the file's left margin ("- name:")
# with its fields indented relative to it; comment and blank lines are dropped.
#
# Fields follow aven's custom-command schema
# (https://aventasks.dev/custom-commands/): name and program are required;
# aliases, description, cwd, env, timeout_seconds, args, keys, detail_keys,
# target, execution, and on_success are optional. Names must be unique across
# custom and built-in commands. Point AVEN_COMMANDS_FILE at another file to use
# a different set of extra commands.
#
# --- Example: an aven-native task workflow -----------------------------------
#
# `sdd` ships active so you can see the workflow pattern, but it is only an
# example: edit it, rebind it, or delete it. It shows how to use dispatch plus
# aven for efficient task management — one command takes the selected task from
# a rough request to shipped, keeping the spec in the task description, the plan
# in a note, the breakdown in child tasks, and progress in statuses and notes.
#
# --skill names the bundled skill text as a path relative to skills.
# `aven/sdd` resolves to skills/aven/sdd.md. Write your own namespaced skill file
# and point another entry at it the same way.

- name: sdd
  aliases: [aven-sdd]
  description: Work the selected task through define, plan, break down, implement (example)
  program: aven-dispatch
  args:
    - dispatch
    - --agent
    - select
    - --model
    - github-copilot/gpt-5.6-terra
    - --skill
    - aven/sdd
    - --skills-dir
    - "${PLUGIN_ROOT}/skills"
  keys: [z s]
  detail_keys: [z S]
  target: focused
  execution: terminal
  on_success: quit

# Opt in to an adjacent babysitter while dispatching the selected task. The
# dispatcher creates and prompts both OpenCode sessions through the V2 API,
# leaves the build agent in the worktree's original pane, then attaches the
# babysitter session in a sibling pane to the right.
- name: dispatch-babysitter
  aliases: [dispatch-with-babysitter]
  description: Implement the selected task with an adjacent autonomous babysitter
  program: aven-dispatch
  args:
    - dispatch
    - --agent
    - select
    - --model
    - github-copilot/gpt-5.6-terra
    - --babysitter
  keys: [z b]
  detail_keys: [z B]
  target: focused
  execution: terminal
  on_success: quit

